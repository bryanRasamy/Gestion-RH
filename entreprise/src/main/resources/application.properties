spring.application.name=entreprise

# ===== Base de données PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_entreprise
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.session.jdbc.initialize-schema=always
server.port=8080

# ===== Upload des CV / lettres de motivation (enregistrés dans la base) =====
# (le contrôle des 5 Mo est fait dans CandidatService pour afficher un message clair)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ===== Affichage =====
spring.jpa.open-in-view=true
spring.web.locale=fr
spring.web.locale-resolver=fixed
