<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouvelle demande — Pivot</title>
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body class="dashboard-page">
<main class="req-form">
    <a class="back-link" href="/departements/accueil">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>
        Retour aux demandes
    </a>
    <form class="logout-form" action="/logout" method="post">
        <button class="btn-logout" type="submit">Déconnexion</button>
    </form>

    <header class="req-form__top">
        <div>
            <p class="eyebrow" th:text="${superAdmin ? 'Super administrateur DG' : 'Espace manager'}"></p>
            <h1 th:text="${superAdmin ? 'Créer une demande pour un département' : 'Créer une demande'}"></h1>
        </div>
        <p class="req-form__count">Circuit de validation</p>
    </header>

    <p class="form__success is-visible is-error" role="alert"
       th:if="${erreur}" th:text="${erreur}"></p>

    <form action="/demandes/creer" method="post">
        <div class="req-form__meta">
            <label class="req-form__deadline" for="dateLimite">
                <span class="req-form__deadline-label">Date limite</span>
                <span class="req-form__deadline-control">
                    <input id="dateLimite" type="date" name="dateLimite" required>
                </span>
            </label>
        </div>

        <div class="req-form__cols" aria-hidden="true">
            <span>Ligne</span>
            <span>Poste</span>
            <span>Département associé</span>
            <span>Effectif</span>
            <span>Description</span>
            <span></span>
        </div>

        <div class="req-form__rows" id="lignes">
            <div class="req-row ligne">
                <span class="req-row__index">01</span>

                <div class="req-row__field req-row__field--poste">
                    <label class="req-row__label-mobile">Poste</label>
                    <select name="posteIds" required>
                        <option value="">Choisir un poste</option>
                        <option th:each="poste : ${postes}"
                                th:value="${poste.id}"
                                th:text="${poste.libelle}"
                                th:data-departement-id="${poste.departement.id}"
                                th:data-departement-libelle="${poste.departement.libelle}">
                        </option>
                    </select>
                </div>

                <div class="req-row__field req-row__field--dept">
                    <label class="req-row__label-mobile">Département associé</label>
                    <input class="departement-libelle" type="text" readonly
                           placeholder="Choisissez d’abord un poste">
                    <input class="departement-id" type="hidden" name="departementIds">
                </div>

                <div class="req-row__field req-row__field--num">
                    <label class="req-row__label-mobile">Effectif</label>
                    <input type="number" name="nombres" min="1" value="1" required>
                </div>

                <div class="req-row__field req-row__field--description">
                    <label class="req-row__label-mobile">Description</label>
                    <textarea name="descriptions" rows="2"
                              placeholder="Décrivez le besoin"></textarea>
                </div>

                <button class="req-row__remove" type="button" aria-label="Supprimer cette ligne">
                    <span aria-hidden="true">×</span>
                </button>
            </div>
        </div>

        <div class="req-form__foot">
            <button class="btn-add" type="button" id="ajouter">
                <span class="btn-add__icon" aria-hidden="true">+</span>
                Ajouter un poste
            </button>
            <button class="submit" type="submit">
                <span class="submit__label">Créer la demande</span>
                <span class="submit__icon" aria-hidden="true">
                    <svg class="submit__arrow" width="18" height="18" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="1.6"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 12h15M13 6l6 6-6 6"></path>
                    </svg>
                </span>
            </button>
        </div>
    </form>
</main>
<script>
const lignes = document.getElementById('lignes');

function numeroterLignes() {
    const elements = lignes.querySelectorAll('.ligne');
    elements.forEach(function (ligne, index) {
        ligne.querySelector('.req-row__index').textContent = String(index + 1).padStart(2, '0');
        ligne.querySelector('.req-row__remove').disabled = elements.length === 1;
    });
}

document.getElementById('ajouter').addEventListener('click', function () {
    const ligne = lignes.querySelector('.ligne').cloneNode(true);
    ligne.querySelectorAll('select').forEach(function (select) {
        select.selectedIndex = 0;
    });
    ligne.querySelectorAll('input').forEach(function (input) {
        input.value = input.name === 'nombres' ? '1' : '';
    });
    ligne.querySelector('textarea').value = '';
    lignes.appendChild(ligne);
    numeroterLignes();
});

lignes.addEventListener('change', function (evenement) {
    if (!evenement.target.matches('select[name="posteIds"]')) {
        return;
    }

    const ligne = evenement.target.closest('.ligne');
    const option = evenement.target.selectedOptions[0];
    ligne.querySelector('.departement-id').value = option.dataset.departementId || '';
    ligne.querySelector('.departement-libelle').value = option.dataset.departementLibelle || '';
});

lignes.addEventListener('click', function (evenement) {
    const bouton = evenement.target.closest('.req-row__remove');
    if (bouton && lignes.querySelectorAll('.ligne').length > 1) {
        bouton.closest('.ligne').remove();
        numeroterLignes();
    }
});

numeroterLignes();
</script>
</body>
</html>
