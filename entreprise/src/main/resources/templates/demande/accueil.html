<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mes demandes — Pivot</title>
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body class="dashboard-page">
<main class="wrap">
    <header class="head">
        <div class="head__title">
            <p class="eyebrow" th:text="${role}"></p>
            <h1 th:text="${superAdmin ? 'Toutes les demandes' : 'Mes demandes'}"></h1>
        </div>
        <nav class="page-actions" aria-label="Actions manager">
            <a class="button-link" href="/demandes/nouvelle">Nouvelle demande</a>
            <a class="button-link button-link--quiet" href="/correction/accueil">Corrections</a>
            <a class="button-link button-link--quiet" href="/rh/accueil" th:if="${superAdmin}">File RH</a>
            <a class="button-link button-link--quiet" href="/finance/accueil" th:if="${superAdmin}">File Finance</a>
            <a class="button-link button-link--quiet" href="/dg/accueil" th:if="${superAdmin}">File DG</a>
            <form action="/logout" method="post">
                <button class="logout-button" type="submit">Déconnexion</button>
            </form>
        </nav>
    </header>
    <p class="form__success is-visible" role="status" th:if="${succes}" th:text="${succes}"></p>
    <p class="form__success is-visible is-error" role="alert" th:if="${erreur}" th:text="${erreur}"></p>
    <section class="dashboard__grid">
        <a class="req-card req-card--pending"
           th:each="demande, iter : ${demandes}"
           th:classappend="${statuts[iter.index] == 'à revoir' ? 'req-card--review' : statuts[iter.index] == 'refusé' ? 'req-card--refused' : statuts[iter.index] == 'validé DG' ? 'req-card--accepted' : ''}"
           th:href="@{'/demandes/' + ${demande.id}}">
            <div class="req-card__head">
                <div>
                    <h2 class="req-card__ref" th:text="${demande.matricule}"></h2>
                    <p class="req-card__meta">
                        Date limite : <span th:text="${demande.dateLimite}"></span>
                    </p>
                </div>
                <span class="status-pill" th:text="${statuts[iter.index]}"></span>
            </div>
            <div class="req-card__foot">
                <span class="req-card__link">
                    Voir le détail
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                        <path d="M4 12h15M13 6l6 6-6 6"></path>
                    </svg>
                </span>
            </div>
        </a>
    </section>
    <p class="card muted" th:if="${#lists.isEmpty(demandes)}">Aucune demande créée.</p>
</main>
</body>
</html>
