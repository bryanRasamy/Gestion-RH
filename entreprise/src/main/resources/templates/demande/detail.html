<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${demande.matricule}">Demande</title>
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>
<main class="workflow">
    <h1 th:text="${demande.matricule}">REQ</h1>
    <p th:text="'Echeance : ' + ${demande.dateLimite}">Echeance</p>
    <section class="card">
        <h2>Details de la demande</h2>
        <table>
            <thead><tr><th>Poste</th><th>Departement</th><th>Effectif</th><th>Description</th></tr></thead>
            <tbody>
            <tr th:each="detail : ${details}">
                <td th:text="${detail.idPoste}">1</td>
                <td th:text="${detail.idDepartement}">1</td>
                <td th:text="${detail.nbrPersonnel}">1</td>
                <td th:text="${detail.description}">Description</td>
            </tr>
            </tbody>
        </table>
    </section>
    <section class="card">
        <h2>Historique</h2>
        <ul><li th:each="statut : ${historique}"
            th:text="${statut.date + ' - ' + statut.libelle + (statut.motif != null ? ' : ' + statut.motif : '')}">Statut</li></ul>
    </section>
</main>
</body>
</html>
