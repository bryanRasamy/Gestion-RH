<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pivot — Demandes de personnel</title>
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>

<body class="dashboard-page">

<nav class="app-nav" id="appNav">
  <div class="app-nav__inner">

    <a href="#" class="logo" aria-label="Pivot — accueil">
      <span class="logo__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="17" height="17">
          <path d="M8 27V5h7.5a6 6 0 0 1 0 12H8" fill="none"
                stroke="currentColor" stroke-width="2.4"
                stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
      </span>
      <span class="logo__word">Pivot</span>
    </a>

    <ul class="app-nav__links" id="appNavLinks">
      <li><a href="/departements/accueil" class="app-nav__link is-active">Demandes</a></li>
      <li><a href="/departements/demandes/nouvelle" class="app-nav__link">Nouvelle demande</a></li>
      <li><a href="#" class="app-nav__link">Équipe</a></li>
      <li><a href="#" class="app-nav__link">Rapports</a></li>
      <li><a href="#" class="app-nav__link">Paramètres</a></li>
    </ul>

    <div class="app-nav__user">
      <div class="avatar" aria-hidden="true">U</div>
      <span class="app-nav__user-name" th:text="|${utilisateur.employer.nom} ${utilisateur.employer.prenom}|">Amadou D.</span>
    </div>

    <button class="app-nav__toggle" id="appNavToggle"
            aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="appNavLinks">
      <span></span><span></span><span></span>
    </button>

  </div>
</nav>

<main class="dashboard">

  <header class="dashboard__head">
    <p class="eyebrow" th:text="|Département ${departement.libelle}|">Département Informatique</p>
    <h1>Demandes de personnel</h1>
    <p class="dashboard__count" th:text="${#lists.size(demandes) + ' demandes · ' + #lists.size(demandes.?[libelle == 'En attente']) + ' en attente de traitement'}">06 demandes · 03 en attente de traitement</p>
  </header>

  <p class="form__success is-visible is-error" role="alert" th:if="${erreur}">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
    </svg>
    <span th:text="${erreur}"></span>
  </p>

  <div class="dashboard__grid">

    <article class="req-card req-card--pending" th:each="demande : ${demandes}"
             th:classappend="${demande.libelle == 'En attente' ? ' req-card--pending' : (demande.libelle == 'Approuvée' ? ' req-card--accepted' : (demande.libelle == 'En cours' ? ' req-card--review' : (demande.libelle == 'Refusée' ? ' req-card--refused' : ' req-card--pending')))}">
      <div class="req-card__head">
        <span class="badge"
              th:classappend="${demande.libelle == 'En attente' ? ' badge--pending' : (demande.libelle == 'Approuvée' ? ' badge--accepted' : (demande.libelle == 'En cours' ? ' badge--review' : (demande.libelle == 'Refusée' ? ' badge--refused' : ' badge--pending')))}"
              th:text="${demande.libelle}">En attente</span>
      </div>
      <h3 class="req-card__ref" th:text="${demande.matricule}">REQ-2026-014</h3>
      <p class="req-card__meta" th:text="'Créée le ' + ${#temporals.format(demande.date, 'dd MMMM yyyy')}">Créée le 12 juin 2026</p>
      <div class="req-card__foot">
        <a href="#" class="req-card__link">
          Voir détail
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </a>
      </div>
    </article>

  </div>

</main>

<script>
(function () {
  'use strict';
  const nav    = document.getElementById('appNav');
  const toggle = document.getElementById('appNavToggle');

  if (toggle) {
    toggle.addEventListener('click', () => {
      const open = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open);
      toggle.setAttribute('aria-label', open ? 'Fermer le menu' : 'Ouvrir le menu');
    });
  }

  document.querySelectorAll('.app-nav__link').forEach(link => {
    link.addEventListener('click', () => {
      nav.classList.remove('is-open');
      toggle.setAttribute('aria-expanded', 'false');
    });
  });
})();
</script>

</body>
</html>
