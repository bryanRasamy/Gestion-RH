<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pivot — Correction de demande</title>
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>

<body class="dashboard-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="dashboard">

  <a th:href="@{'/' + ${roleSigle} + '/demandes/' + ${demande.id}}" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M11 6l-6 6 6 6"/>
    </svg>
    Retour au détail
  </a>

  <header class="dashboard__head">
    <p class="eyebrow" th:text="|Correction — ${demande.matricule}|">Correction</p>
    <h1>Mettre à revoir</h1>
    <p class="dashboard__count">Seul l'effectif est modifiable. Les autres champs sont présentés à titre indicatif.</p>
  </header>

  <p class="form__success is-visible is-error" role="alert" th:if="${erreur}">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
    </svg>
    <span th:text="${erreur}"></span>
  </p>

  <form class="req-form"
        th:action="@{'/' + ${roleSigle} + '/demandes/' + ${demande.id} + '/correction'}"
        method="post" novalidate>

    <!-- Motif obligatoire -->
    <div class="req-form__meta" style="margin-bottom: 24px;">
      <div class="req-form__deadline" style="width:100%;">
        <label for="motif" class="req-form__deadline-label">Motif de la mise à revoir</label>
        <div class="req-form__deadline-control">
          <textarea id="motif" name="motif" rows="2" required
                    placeholder="Expliquez pourquoi la demande doit être revue…"
                    style="width:100%; padding:8px 0; border:0; border-bottom:1px solid var(--line-strong);
                           background:transparent; font-family:var(--sans); font-size:15px;
                           color:var(--text-1); outline:none; resize:vertical;"></textarea>
        </div>
        <p class="req-form__deadline-error" id="motifError" style="opacity:0;">Champ requis</p>
      </div>
    </div>

    <!-- En-tête colonnes — MÊMES classes que nouvelle.html -->
    <div class="req-form__cols" aria-hidden="true">
      <span></span>
      <span>Département</span>
      <span>Poste</span>
      <span>Diplôme</span>
      <span>Exp. (ans)</span>
      <span>Effectif</span>
      <span>Motif</span>
      <span></span>
    </div>

    <div class="req-form__rows" id="correctionRows">

      <div class="req-row" th:each="detail, iter : ${details}">
        <!-- id caché du détail -->
        <input type="hidden" name="detailId" th:value="${detail.id}">

        <span class="req-row__index" th:text="${#numbers.formatInteger(iter.count, 2)}">01</span>

        <div class="req-row__field req-row__field--dept">
          <label class="req-row__label-mobile">Département</label>
          <input type="text" th:value="${detail.departement.libelle}" disabled>
        </div>

        <div class="req-row__field req-row__field--poste">
          <label class="req-row__label-mobile">Poste</label>
          <input type="text" th:value="${detail.poste.libelle}" disabled>
        </div>

        <div class="req-row__field req-row__field--diplome">
          <label class="req-row__label-mobile">Diplôme</label>
          <input type="text" th:value="${detail.diplome.nomDiplome}" disabled>
        </div>

        <div class="req-row__field req-row__field--exp">
          <label class="req-row__label-mobile">Exp. (ans)</label>
          <input type="number" th:value="${detail.anneeExperience}" disabled>
        </div>

        <div class="req-row__field req-row__field--num">
          <label class="req-row__label-mobile">Effectif</label>
          <input type="number" name="nbSouhaite" class="effectif"
                 th:value="${detail.nbrPersonnel}"
                 min="1" step="1" required inputmode="numeric">
        </div>

        <div class="req-row__field req-row__field--motif">
          <label class="req-row__label-mobile">Motif</label>
          <input type="text" th:value="${detail.motif}" disabled>
        </div>

        <span></span>
      </div>

    </div>

    <div class="req-form__foot">
      <p class="req-form__hint">
        Les champs grisés ne sont pas modifiables. Seul l'effectif sera enregistré comme correction.
      </p>
      <button type="submit" class="submit" id="submitBtn">
        <span class="submit__label">Soumettre la correction</span>
        <span class="submit__icon">
          <svg class="submit__arrow" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12h15M13 6l6 6-6 6"/>
          </svg>
        </span>
      </button>
    </div>
  </form>

</main>

<script>
(function () {
  'use strict';

  var nav    = document.getElementById('appNav');
  var toggle = document.getElementById('appNavToggle');
  if (toggle) {
    toggle.addEventListener('click', function() {
      var open = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open);
    });
  }

  var form      = document.querySelector('form.req-form');
  var motif     = document.getElementById('motif');
  var motifErr  = document.getElementById('motifError');
  var effectifs = document.querySelectorAll('.effectif');

  function afficherMotifErr(visible) {
    motifErr.style.opacity = visible ? '1' : '0';
  }

  motif.addEventListener('input', function () {
    if (motif.value.trim()) afficherMotifErr(false);
  });

  effectifs.forEach(function (input) {
    input.addEventListener('input', function () {
      if (input.value && parseInt(input.value, 10) < 1) input.value = 1;
    });
  });

  form.addEventListener('submit', function (e) {
    var ok = true;

    if (!motif.value.trim()) {
      afficherMotifErr(true);
      motif.focus();
      ok = false;
    }

    for (var i = 0; i < effectifs.length; i++) {
      var v = parseInt(effectifs[i].value, 10);
      if (isNaN(v) || v < 1) {
        effectifs[i].classList.add('is-invalid');
        effectifs[i].focus();
        ok = false;
        break;
      } else {
        effectifs[i].classList.remove('is-invalid');
      }
    }

    if (!ok) e.preventDefault();
  });
})();
</script>

</body>
</html>
