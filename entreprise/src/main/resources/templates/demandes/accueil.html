<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pivot — Demandes</title>
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>

<body class="dashboard-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="dashboard">

  <header class="dashboard__head">
    <p class="eyebrow" th:text="${role != null ? role.libelle : 'Accueil'}">Rôle</p>
    <h1>Demandes de personnel</h1>
    <p class="dashboard__count" th:text="${#lists.size(demandes)} + ' demande(s)'">0 demandes</p>
  </header>

  <p class="form__success is-visible is-error" role="alert" th:if="${erreur}">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
    </svg>
    <span th:text="${erreur}"></span>
  </p>

  <p class="form__success is-visible" role="status" th:if="${succes}"
     style="border-left-color: var(--ok); background: rgba(44, 90, 66, .06); color: var(--ok);">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
    <span th:text="${succes}"></span>
  </p>

  <div class="budget-card budget-card--ok" th:if="${budgetAnnuel != null}" style="margin-bottom: 24px;">
    <p class="budget-card__montant">
      Budget annuel de l'entreprise :
      <strong th:text="${#numbers.formatDecimal(budgetAnnuel, 0, 'COMMA', 0, 'POINT')} + ' Ar'">0 Ar</strong>
    </p>
  </div>

  <form class="dashboard__filters" method="get" th:action="@{'/' + ${roleSigle} + '/accueil'}">
    <div class="filter-group">
      <label for="status" class="filter-label">Statut</label>
      <select name="status" id="status" class="filter-input">
        <option value="">Tous</option>
        <option value="CR" th:selected="${filterStatus == 'CR'}">Créée</option>
        <option value="VA" th:selected="${filterStatus == 'VA'}">Validée</option>
        <option value="RF" th:selected="${filterStatus == 'RF'}">Refusée</option>
        <option value="AR" th:selected="${filterStatus == 'AR'}">À revoir</option>
        <option value="AN" th:selected="${filterStatus == 'AN'}">Annulée</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="dateMin" class="filter-label">Date min</label>
      <input type="date" name="dateMin" id="dateMin" class="filter-input" th:value="${filterDateMin}">
    </div>
    <div class="filter-group">
      <label for="dateMax" class="filter-label">Date max</label>
      <input type="date" name="dateMax" id="dateMax" class="filter-input" th:value="${filterDateMax}">
    </div>
    <button type="submit" class="filter-btn">Filtrer</button>
  </form>

  <div class="dashboard__grid">

    <article class="req-card"
             th:each="demande : ${demandes}"
             th:classappend="${demande.sigle == 'VA' ? ' req-card--accepted' :
                              demande.sigle == 'RF' ? ' req-card--refused' :
                              demande.sigle == 'AR' ? ' req-card--review' :
                              demande.sigle == 'AN' ? ' req-card--refused' :
                              ' req-card--pending'}">
      <div class="req-card__head">
        <span class="badge"
              th:classappend="${demande.sigle == 'VA' ? ' badge--accepted' :
                               demande.sigle == 'RF' ? ' badge--refused' :
                               demande.sigle == 'AR' ? ' badge--review' :
                               demande.sigle == 'AN' ? ' badge--refused' :
                               ' badge--pending'}"
              th:text="${demande.libelleEnrichi}">Validé par RH</span>
      </div>
      <h3 class="req-card__ref" th:text="${demande.matricule}">DM001</h3>
      <p class="req-card__meta" th:text="'Mis à jour le ' + ${#temporals.format(demande.date, 'dd MMMM yyyy HH:mm')}">Date</p>
      <div class="req-card__foot">
        <a th:href="@{'/' + ${roleSigle} + '/demandes/' + ${demande.idDemande}}" class="req-card__link">
          Voir détail
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </a>
      </div>
    </article>

  </div>

</main>

<script>
(function () {
  'use strict';
  var nav    = document.getElementById('appNav');
  var toggle = document.getElementById('appNavToggle');
  if (toggle) {
    toggle.addEventListener('click', function() {
      var open = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', open);
    });
  }
})();
</script>

</body>
</html>
