<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pivot — Nouvelle demande</title>
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>

<body class="dashboard-page">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="dashboard">

    <a th:href="@{'/' + ${roleSigle} + '/accueil'}" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M11 6l-6 6 6 6"/>
        </svg>
        Retour aux demandes
    </a>

    <header class="dashboard__head">
        <p class="eyebrow" th:text="|Département ${departement != null ? departement.libelle : ''}|">Département</p>
        <h1>Nouvelle demande</h1>
        <p class="dashboard__count">Renseignez l'échéance, chaque poste requis, puis validez.</p>
    </header>

    <form class="req-form" id="requestForm"
          th:action="@{'/' + ${roleSigle} + '/demandes'}"
          th:object="${demande}" method="post" novalidate>
        <input type="hidden" name="departementId" id="departementId"
               th:value="${departement != null ? departement.id : 0}">

        <p class="form__success is-visible is-error" role="alert" th:if="${erreur}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
            </svg>
            <span th:text="${erreur}"></span>
        </p>

        <div class="req-form__top">
            <p class="req-form__count" id="count">01 poste · 01 personne</p>
            <button type="button" class="btn-add" id="addRow">
                <span class="btn-add__icon">+</span>
                <span>Ajouter un poste</span>
            </button>
        </div>

        <div class="req-form__meta">
            <div class="req-form__deadline">
                <label for="deadline" class="req-form__deadline-label">Date limite</label>
                <div class="req-form__deadline-control">
                    <input type="date" id="deadline" th:field="*{dateLimite}" required>
                </div>
                <p th:if="${#fields.hasErrors('dateLimite')}" th:errors="*{dateLimite}"></p>
            </div>
        </div>

        <div class="req-form__cols" aria-hidden="true">
            <span></span>
            <span>Département</span>
            <span>Poste</span>
            <span>Diplôme</span>
            <span>Exp. (ans)</span>
            <span>Nb</span>
            <span>Motif</span>
            <span></span>
        </div>

        <div class="req-form__rows" id="rows"></div>

        <div class="req-form__foot">
            <p class="req-form__hint">
                Chaque poste est compté séparément. Votre demande sera transmise pour validation.
            </p>
            <button type="submit" class="submit" id="submitBtn">
                <span class="submit__label">Créer ma demande</span>
                <span class="submit__icon">
                    <svg class="submit__arrow" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="1.6"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 12h15M13 6l6 6-6 6"/>
                    </svg>
                    <span class="spinner"></span>
                </span>
            </button>
        </div>

        <p class="form__success" id="formSuccess" role="status"></p>
    </form>

</main>

<script th:src="@{/assets/js/nouvelle-demande.js}"></script>

</body>
</html>
