<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pivot — Nouvelle proposition</title>
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body class="dashboard-page">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="dashboard">
  <a th:href="@{'/rh/candidatures/' + ${candidat.id}}" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M11 6l-6 6 6 6"/>
    </svg>
    Retour à la candidature
  </a>

  <header class="dashboard__head">
    <p class="eyebrow" th:text="|Proposition — ${candidat.prenom + ' ' + candidat.nom}|"></p>
    <h1>Nouvelle proposition</h1>
  </header>

  <p class="form__success is-visible is-error" role="alert" th:if="${erreur}"><span th:text="${erreur}"></span></p>

  <form th:action="@{'/rh/candidatures/' + ${candidat.id} + '/proposition'}" method="post" class="req-form">
    <div class="req-form__meta">
      <div class="req-form__deadline" style="width:100%;">
        <label class="req-form__deadline-label">Salaire proposé (Ar brut/mois)</label>
        <div class="req-form__deadline-control">
          <input type="number" name="salaire" step="0.01" required value="3500000">
        </div>
      </div>
    </div>

    <div class="req-form__meta">
      <div class="req-form__deadline" style="width:100%;">
        <label class="req-form__deadline-label">Date de début</label>
        <div class="req-form__deadline-control">
          <input type="datetime-local" name="dateDebut" required>
        </div>
      </div>
    </div>

    <div class="req-form__meta">
      <div class="req-form__deadline" style="width:100%;">
        <label class="req-form__deadline-label">Lieu de travail</label>
        <div class="req-form__deadline-control">
          <input type="text" name="lieu" required placeholder="Antananarivo, Immeuble Pivot">
        </div>
      </div>
    </div>

    <div class="req-form__meta">
      <div class="req-form__deadline" style="width:100%;">
        <label class="req-form__deadline-label">Horaires</label>
        <div class="req-form__deadline-control">
          <input type="text" name="horaires" required placeholder="Lun-Ven, 8h-17h">
        </div>
      </div>
    </div>

    <div class="req-form__foot">
      <p class="req-form__hint">
        6 questions seront générées automatiquement à partir de ces informations.
      </p>
      <button type="submit" class="submit">
        <span class="submit__label">Envoyer la proposition</span>
      </button>
    </div>
  </form>
</main>
<script>
(function () {
  var nav = document.getElementById('appNav');
  var toggle = document.getElementById('appNavToggle');
  if (toggle) toggle.addEventListener('click', function() {
    var open = nav.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', open);
  });
})();
</script>
</body>
</html>
