<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pivot — Renouveler le contrat</title>
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body class="dashboard-page">

<style>
  .renewal-shell {
    max-width: 760px;
    margin: 32px auto 0;
    padding: 28px;
    background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(246,248,251,0.98));
    border: 1px solid rgba(15, 23, 42, 0.08);
    border-radius: 22px;
    box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
  }

  .renewal-shell .req-form {
    margin-top: 18px;
    padding: 0;
    background: transparent;
    box-shadow: none;
    border: none;
  }

  .renewal-shell .field {
    margin-bottom: 22px;
  }

  .renewal-shell .field__top {
    margin-bottom: 10px;
  }

  .renewal-shell .field__top label {
    font-size: 0.95rem;
    font-weight: 700;
    color: #1f2937;
  }

  .renewal-shell .field__control input,
  .renewal-shell .field__control select {
    height: 52px;
    border-radius: 14px;
    border: 1px solid rgba(148, 163, 184, 0.45);
    box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
    background: #fff;
    font-size: 0.98rem;
  }

  .renewal-shell .field__control input:focus,
  .renewal-shell .field__control select:focus {
    border-color: rgba(37, 99, 235, 0.6);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
  }

  .renewal-shell .req-form__foot {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid rgba(148, 163, 184, 0.22);
  }

  .renewal-shell .req-form__hint {
    margin-bottom: 18px;
    line-height: 1.6;
    color: #4b5563;
  }

  .renewal-shell .btn--accept {
    min-width: 220px;
  }

  .renewal-shell .hidden {
    display: none !important;
  }
</style>

<nav class="app-nav" id="appNav">
  <div class="app-nav__inner">
    <a th:href="@{/employe/accueil}" class="logo">
      <span class="logo__mark"><svg viewBox="0 0 32 32" width="17" height="17"><path d="M8 27V5h7.5a6 6 0 0 1 0 12H8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg></span>
      <span class="logo__word">Pivot</span>
    </a>
    <ul class="app-nav__links">
      <li><a th:href="@{/employe/accueil}" class="app-nav__link">Accueil</a></li>
      <li><a th:href="@{/employe/contrats}" class="app-nav__link is-active">Mon contrat</a></li>
    </ul>
    <div class="app-nav__user">
      <div class="avatar" th:text="${#strings.toUpperCase(#strings.substring(utilisateur.email,0,1))}">U</div>
      <a href="/logout" class="app-nav__link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></a>
    </div>
  </div>
</nav>

<main class="dashboard">

  <a th:href="@{/employe/contrats}" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M11 6l-6 6 6 6"/>
    </svg>
    Retour aux contrats
  </a>

  <header class="dashboard__head">
    <p class="eyebrow">Demande de renouvellement</p>
    <h1>Renouveler mon contrat</h1>
    <p class="dashboard__count">
      Contrat précédent : <strong th:text="${contratCourant.contratType.libelle}"></strong>
      — fin le <strong th:text="${contratCourant.dateFin != null ? #temporals.format(contratCourant.dateFin, 'dd MMMM yyyy') : 'non applicable'}"></strong>
    </p>
  </header>

  <p class="form__success is-visible is-error" role="alert" th:if="${erreur}"><span th:text="${erreur}"></span></p>

  <div class="renewal-shell">
    <form th:action="@{/employe/contrats/renouveler}" method="post" class="req-form">

      <div class="field">
        <div class="field__top"><label for="typeContrat">Nouveau type de contrat</label></div>
        <div class="field__control">
          <select id="typeContrat" name="typeContrat" required>
            <option value="">Sélectionner…</option>
            <option th:each="ct : ${contratTypes}"
                    th:value="${ct.libelle}"
                    th:attr="data-duree-max=${ct.dureeMaxMois}"
                    th:text="${ct.libelle + ' — ' + (ct.dureeMaxMois != null ? ct.dureeMaxMois + ' mois max' : 'durée indéterminée')}"></option>
          </select>
        </div>
      </div>

      <div class="field">
        <div class="field__top"><label for="dateDebut">Date de début</label></div>
        <div class="field__control">
          <input type="date" id="dateDebut" name="dateDebut" required>
        </div>
      </div>

      <div class="field" id="dateFinField">
        <div class="field__top"><label for="dateFin">Date de fin</label></div>
        <div class="field__control">
          <input type="date" id="dateFin" name="dateFin">
        </div>
      </div>

      <div class="field">
        <div class="field__top"><label for="salaire">Nouveau salaire (Ar brut/mois)</label></div>
        <div class="field__control">
          <input type="number" id="salaire" name="salaire" step="0.01" min="0" required
                 th:value="${contratCourant.salaire}">
        </div>
      </div>

      <div class="req-form__foot">
        <p class="req-form__hint">
          Le nouveau contrat sera créé avec le statut <strong>Créé</strong>.
          Vous devrez le signer, puis la DG validera.
        </p>
        <button type="submit" class="btn btn--accept">Créer le nouveau contrat</button>
      </div>
    </form>
  </div>

</main>

<script>
  (function () {
    const select = document.getElementById('typeContrat');
    const dateFinField = document.getElementById('dateFinField');
    const dateFinInput = document.getElementById('dateFin');

    function toggleDateFin() {
      const option = select.selectedOptions[0];
      const duree = option && option.dataset.dureeMax;
      const isIndeterminate = !duree || duree === 'null' || duree === '';

      if (isIndeterminate) {
        dateFinField.classList.add('hidden');
        dateFinInput.disabled = true;
        dateFinInput.removeAttribute('required');
        dateFinInput.value = '';
      } else {
        dateFinField.classList.remove('hidden');
        dateFinInput.disabled = false;
        dateFinInput.setAttribute('required', 'required');
      }
    }

    if (select) {
      select.addEventListener('change', toggleDateFin);
      toggleDateFin();
    }
  })();
</script>

</body>
</html>
