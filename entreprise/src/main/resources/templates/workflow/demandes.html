<!doctype html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title th:text="${titre}">Validation</title><link rel="stylesheet" th:href="@{/assets/css/style.css}"></head><body class="dashboard-page"><main class="dashboard"><header class="dashboard__head"><h1 th:text="${titre} + ' — demandes à traiter'">Demandes</h1><p><a href="/logout">Se déconnecter</a></p></header><p th:if="${succes}" th:text="${succes}"></p><p th:if="${erreur}" th:text="${erreur}"></p><article class="req-card" th:each="ligne : ${demandes}"><h3 th:text="${ligne.demande.matricule}">DM001</h3><p th:text="|Échéance : ${ligne.demande.dateLimite}|"></p><p th:if="${etape == 'FINANCE'}" th:with="b=${budgetService.evaluer(ligne.demande.id)}" th:text="|Budget min. ${b.minimum}, max. ${b.maximum}, disponible ${b.budget} — ${b.indication}|">Budget</p><form th:action="@{/{module}/demandes/{id}/decision(module=${#strings.toLowerCase(etape)},id=${ligne.demande.id})}" method="post"><label>Commentaire <input name="commentaire"></label><button name="accepter" value="true">Valider</button><button name="accepter" value="false">Refuser</button></form></article><p th:if="${#lists.isEmpty(demandes)}">Aucune demande à traiter.</p></main></body></html>
