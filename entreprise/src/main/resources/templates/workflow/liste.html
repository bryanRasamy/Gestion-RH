<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Demandes - role ' + ${idRole}">Demandes</title>
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body class="dashboard-page">

<nav class="app-nav">
    <div class="app-nav__inner">
        <a href="#" class="logo">
            <span class="logo__mark">V</span>
            <span class="logo__word">Validation</span>
        </a>
        <ul class="app-nav__links">
            <li><a th:href="@{'/' + ${roleSlug} + '/accueil'}" class="app-nav__link is-active">Demandes</a></li>
            <li><a th:href="@{/workflow/manager/corrections}" class="app-nav__link">Corrections</a></li>
        </ul>
    </div>
</nav>

<main class="dashboard validation-page">
    <header class="dashboard__head">
        <p class="eyebrow">Workflow de validation</p>
        <h1 th:text="'Demandes - role ' + ${idRole}">Demandes</h1>
        <p class="dashboard__count">Filtrez puis traitez les demandes.</p>
    </header>

    <form method="get" th:action="@{'/' + ${roleSlug} + '/accueil'}" class="validation-filters">
        <label>Date min <input type="date" name="dateMin" th:value="${dateMin}"></label>
        <label>Date max <input type="date" name="dateMax" th:value="${dateMax}"></label>
        <label>Statut <input type="text" name="statut" th:value="${statut}"></label>
        <button type="submit">Filtrer</button>
        <a th:href="@{'/' + ${roleSlug} + '/accueil'}">Reinitialiser</a>
    </form>

    <section class="validation-grid">
        <article class="validation-card" th:each="demande : ${demandes}">
            <h2 th:text="${demande.matricule}">REQ-2026-001</h2>
            <p>Echeance : <strong th:text="${demande.dateLimite}">2026-12-31</strong></p>
            <a class="validation-link" th:href="@{'/demandes/' + ${demande.id}}">Voir les details</a>
        </article>
        <p class="validation-empty" th:if="${#lists.isEmpty(demandes)}">Aucune demande pour ces criteres.</p>
    </section>
</main>
</body>
</html>
