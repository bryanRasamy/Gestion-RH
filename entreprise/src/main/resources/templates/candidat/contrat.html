<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="contenu">

  <header class="dashboard__head">
    <p class="eyebrow">Mon contrat</p>
    <h1>Contrat de travail</h1>
    <p class="dashboard__count">
      <span class="badge"
            th:classappend="${contrat.statut.libelle == 'VALIDE_PAR_DG' ? ' badge--accepted' : ' badge--pending'}"
            th:text="${contrat.statut.libelle}">Statut</span>
    </p>
  </header>

  <section class="detail-section">
    <h2 class="detail-section__title">Résumé</h2>
    <div class="prop-list">
      <div class="prop-list__row">
        <span class="prop-list__label">Type</span>
        <span class="prop-list__value" th:text="${contrat.contratType.libelle}"></span>
      </div>
      <div class="prop-list__row">
        <span class="prop-list__label">Salaire</span>
        <span class="prop-list__value"
              th:text="${#numbers.formatDecimal(contrat.salaire, 0, 'COMMA', 0, 'POINT')} + ' Ar'"></span>
      </div>
      <div class="prop-list__row">
        <span class="prop-list__label">Date de début</span>
        <span class="prop-list__value"
              th:text="${#temporals.format(contrat.dateDebut, 'dd MMMM yyyy')}"></span>
      </div>
      <div class="prop-list__row" th:if="${contrat.dateFin != null}">
        <span class="prop-list__label">Date de fin</span>
        <span class="prop-list__value"
              th:text="${#temporals.format(contrat.dateFin, 'dd MMMM yyyy')}"></span>
      </div>
    </div>
  </section>

  <section class="detail-section">
    <h2 class="detail-section__title">Le document</h2>
    <div class="action-bar">
      <a th:href="@{'/mes-candidatures/' + ${contrat.proposition.candidat.id} + '/contrat/pdf'}"
         class="btn btn--ghost" style="text-decoration:none;">
         Télécharger le contrat PDF
      </a>

      <form th:if="${contrat.statut.libelle == 'CREE'}"
            th:action="@{'/mes-candidatures/' + ${contrat.proposition.candidat.id} + '/contrat/signer'}"
            method="post"
            onsubmit="return confirm('Confirmer la signature du contrat ?');">
        <button type="submit" class="btn btn--accept">
           Signer le contrat
        </button>
      </form>
    </div>
  </section>

  <section class="detail-section">
    <h2 class="detail-section__title">Historique</h2>
    <div class="timeline">
      <div class="timeline-item" th:each="h : ${historique}">
        <div class="timeline-item__dot"></div>
        <div class="timeline-item__body">
          <span class="timeline-item__date"
                th:text="${#temporals.format(h.dateChangement, 'dd/MM/yyyy HH:mm')}"></span>
          <span th:text="${h.statut.libelle}"></span>
          <small th:if="${h.motif != null}" th:text="${'— ' + h.motif}"></small>
        </div>
      </div>
    </div>
  </section>

</th:block>

</body>
</html>
