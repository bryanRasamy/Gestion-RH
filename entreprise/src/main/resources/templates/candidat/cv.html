<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="contenu">

  <header class="dashboard__head">
    <p class="eyebrow">Espace candidat</p>
    <h1>Mon CV en ligne</h1>
    <p class="dashboard__count"
       th:text="|Vous postulez à l'offre : ${offre.poste.libelle} — ${offre.departement.libelle}|">
      Complétez votre profil pour postuler en un clic aux offres.
    </p>
  </header>

  <form class="cv-form" id="cvForm" th:action="@{/cv}" method="post" enctype="multipart/form-data" novalidate>
    <input type="hidden" name="idDetail" th:value="${offre.id}">

    <section class="cv-section">
      <h2 class="cv-section__title"><span>01</span> Identité</h2>
      <div class="form-grid">
        <div class="field">
          <div class="field__top"><label for="prenom">Prénom</label></div>
          <div class="field__control"><input type="text" id="prenom" name="prenom" th:value="${candidat.prenom}" placeholder="Hery" required></div>
        </div>
        <div class="field">
          <div class="field__top"><label for="nom">Nom</label></div>
          <div class="field__control"><input type="text" id="nom" name="nom" th:value="${candidat.nom}" placeholder="Rakoto" required></div>
        </div>
        <div class="field">
          <div class="field__top"><label for="email">E-mail</label></div>
          <div class="field__control"><input type="email" id="email" name="email" th:value="${candidat.email}" placeholder="hery.rakoto@exemple.com" required></div>
        </div>
        <div class="field">
          <div class="field__top"><label for="telephone">Téléphone</label></div>
          <div class="field__control"><input type="tel" id="telephone" name="telephone" th:value="${candidat.telephone}" placeholder="034 12 345 67"></div>
        </div>
      </div>
    </section>

    <section class="cv-section">
      <h2 class="cv-section__title"><span>02</span> Profil</h2>
      <div class="form-grid form-grid--full">
        <div class="field">
          <div class="field__top"><label for="titre">Poste visé</label></div>
          <div class="field__control">
            <input type="text" id="titre" name="titre" th:value="${candidat.titre}" readonly>
          </div>
        </div>
        <div class="field" style="margin-top: 12px;">
          <div class="field__top"><label for="resume">Résumé de parcours</label></div>
          <textarea id="resume" name="resume" class="field__textarea" th:text="${candidat.resume}"
                    placeholder="Décrivez votre parcours en quelques lignes..."></textarea>
        </div>
      </div>
    </section>

    <section class="cv-section">
      <h2 class="cv-section__title"><span>03</span> Expérience professionnelle</h2>
      <div class="form-grid">
        <div class="field">
          <div class="field__top"><label for="dernierPoste">Dernier poste occupé</label></div>
          <div class="field__control"><input type="text" id="dernierPoste" name="dernierPoste" th:value="${candidat.dernierPoste}" placeholder="Développeur Full-stack"></div>
        </div>
        <div class="field">
          <div class="field__top"><label for="entreprise">Entreprise</label></div>
          <div class="field__control"><input type="text" id="entreprise" name="entreprise" th:value="${candidat.entreprise}" placeholder="Tech Solutions SARL"></div>
        </div>
        <div class="field">
          <div class="field__top"><label for="anneeExperienceProf">Année d'expérience professionnelle</label></div>
          <div class="field__control"><input type="number" id="anneeExperienceProf" name="anneeExperienceProf" min="0" th:value="${candidat.anneeExperienceProf}" placeholder="3"></div>
        </div>
      </div>
    </section>

    <section class="cv-section">
      <h2 class="cv-section__title"><span>04</span> Formation</h2>
      <div class="form-grid">
        <div class="field">
          <div class="field__top"><label for="idDiplome">Diplôme</label></div>
          <div class="field__control">
            <select id="idDiplome" name="idDiplome" required>
              <option value="" disabled th:selected="${candidat.idDiplome == null}">Sélectionnez un diplôme...</option>
              <option th:each="d : ${diplomes}" th:value="${d.id}" th:text="${d.nomDiplome}"
                      th:selected="${d.id == candidat.idDiplome}"></option>
            </select>
          </div>
        </div>
        <div class="field">
          <div class="field__top"><label for="ecole">Établissement</label></div>
          <div class="field__control"><input type="text" id="ecole" name="ecole" th:value="${candidat.ecole}" placeholder="Université d'Antananarivo"></div>
        </div>
      </div>
    </section>

    <section class="cv-section">
      <h2 class="cv-section__title"><span>05</span> Documents</h2>
      <div class="upload-grid">
        <div class="upload-zone" id="zoneCV">
          <input type="file" id="fileCV" name="fichierCv" accept=".pdf,.doc,.docx" required>
          <svg class="upload-zone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span class="upload-zone__label">Uploader votre CV</span>
          <span class="upload-zone__hint">PDF, DOC, DOCX (Max 5 Mo)</span>
          <span class="upload-zone__filename" id="nameCV"></span>
        </div>

        <div class="upload-zone" id="zoneLM">
          <input type="file" id="fileLM" name="fichierLm" accept=".pdf,.doc,.docx">
          <svg class="upload-zone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span class="upload-zone__label">Lettre de motivation</span>
          <span class="upload-zone__hint">Optionnel — PDF, DOC, DOCX</span>
          <span class="upload-zone__filename" id="nameLM"></span>
        </div>
      </div>
    </section>

    <button type="submit" class="submit" id="submitBtn">
      <span class="submit__label">Enregistrer et postuler</span>
      <span class="submit__icon">
        <svg class="submit__arrow" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12h15M13 6l6 6-6 6"/>
        </svg>
        <span class="spinner" aria-hidden="true"></span>
      </span>
    </button>
  </form>

  <script>
  (function () {
    'use strict';

    const MAX_OCTETS = 5 * 1024 * 1024;

    function setupUpload(inputId, zoneId, nameId) {
      const input  = document.getElementById(inputId);
      const zone   = document.getElementById(zoneId);
      const nameEl = document.getElementById(nameId);

      input.addEventListener('change', () => {
        if (input.files && input.files.length > 0) {
          if (input.files[0].size > MAX_OCTETS) {
            input.value = '';
            nameEl.textContent = 'Fichier trop volumineux (max 5 Mo)';
            zone.classList.remove('has-file');
            return;
          }
          nameEl.textContent = input.files[0].name;
          zone.classList.add('has-file');
        } else {
          nameEl.textContent = '';
          zone.classList.remove('has-file');
        }
      });
    }

    setupUpload('fileCV', 'zoneCV', 'nameCV');
    setupUpload('fileLM', 'zoneLM', 'nameLM');

    const form      = document.getElementById('cvForm');
    const submitBtn = document.getElementById('submitBtn');

    form.querySelectorAll('input, select, textarea').forEach(el => {
      el.addEventListener('input', () => {
        const f = el.closest('.field');
        if (f) f.classList.remove('has-error');
      });
    });

    form.addEventListener('submit', (e) => {
      let ok = true;
      let premier = null;

      form.querySelectorAll('.field input[required], .field select[required]').forEach(el => {
        const f = el.closest('.field');
        if (!el.value.trim()) {
          f.classList.add('has-error');
          ok = false;
          if (!premier) premier = el;
        }
      });

      const cv = document.getElementById('fileCV');
      if (!cv.files || cv.files.length === 0) {
        document.getElementById('nameCV').textContent = 'Le CV est obligatoire';
        ok = false;
      }

      if (!ok) {
        e.preventDefault();
        if (premier) premier.focus();
        return;
      }

      submitBtn.classList.add('is-loading');
      setTimeout(() => { submitBtn.disabled = true; }, 0);
    });

    window.addEventListener('pageshow', () => {
      submitBtn.classList.remove('is-loading');
      submitBtn.disabled = false;
    });
  })();
  </script>

</th:block>

</body>
</html>
