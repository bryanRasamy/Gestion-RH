<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="contenu">

  <a th:href="@{/mes-candidatures}" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M11 6l-6 6 6 6"/>
    </svg>
    Retour à mes candidatures
  </a>

  <header class="dashboard__head">
    <p class="eyebrow" th:text="|Test — ${candidat.detailDemande.poste.libelle}|">Poste</p>
    <h1 th:text="|Niveau ${niveau}|">Niveau</h1>
    <p class="dashboard__count">
      3 questions · Seuil de réussite :
      <strong th:text="${test.seuilReussite} + '%'">60%</strong>
    </p>
  </header>

  <form th:action="@{'/mes-candidatures/' + ${candidat.id} + '/test/' + ${niveau}}"
        method="post" class="req-form" id="qcmForm">

    <div th:each="q, iter : ${questions}" class="qcm-block">
      <p class="qcm-block__title">
        <span class="qcm-block__num" th:text="${iter.count}">1</span>
        <span th:text="${q.enonce}">Question</span>
      </p>

      <label class="qcm-option">
        <input type="radio" th:name="|q_${q.id}|" value="A" required>
        <span class="qcm-option__letter">A</span>
        <span class="qcm-option__text" th:text="${q.choixA}">Choix A</span>
      </label>

      <label class="qcm-option">
        <input type="radio" th:name="|q_${q.id}|" value="B">
        <span class="qcm-option__letter">B</span>
        <span class="qcm-option__text" th:text="${q.choixB}">Choix B</span>
      </label>

      <label class="qcm-option">
        <input type="radio" th:name="|q_${q.id}|" value="C">
        <span class="qcm-option__letter">C</span>
        <span class="qcm-option__text" th:text="${q.choixC}">Choix C</span>
      </label>

      <label class="qcm-option">
        <input type="radio" th:name="|q_${q.id}|" value="D">
        <span class="qcm-option__letter">D</span>
        <span class="qcm-option__text" th:text="${q.choixD}">Choix D</span>
      </label>
    </div>

    <div class="req-form__foot">
      <p class="req-form__hint">
        Une seule tentative par niveau. Vérifiez vos réponses avant de soumettre.
      </p>
      <button type="submit" class="submit" id="submitBtn">
        <span class="submit__label">Soumettre mes réponses</span>
        <span class="submit__icon">
          <svg class="submit__arrow" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 12h15M13 6l6 6-6 6"/>
          </svg>
          <span class="spinner" aria-hidden="true"></span>
        </span>
      </button>
    </div>
  </form>

</th:block>
</body>
</html>
